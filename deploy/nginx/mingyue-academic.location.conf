# 明月学术交流平台：主站同域子路径接入
#
# 把下面这些 location 加进主站 nginx 的 5000 server 块
# （/etc/nginx/conf.d/mingyueai_5000.conf，listen 5000）。
# 443 的 server 已经把请求全量转给 5000，不需要再改 443 的 location。
#
# 约定：
#   静态站点：/opt/mingyue-academic/static/academic/
#   学术 API：127.0.0.1:8001（uvicorn app.main:app --workers 1）
#   上传目录：/opt/mingyue-academic/uploads/

location = /academic {
    return 301 /academic/;
}

location ^~ /academic/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 800m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location ^~ /academic/uploads/ {
    alias /opt/mingyue-academic/uploads/;
    expires 30d;
    add_header Cache-Control "public";
}

location ^~ /academic/assets/ {
    root /opt/mingyue-academic/static;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location /academic/ {
    root /opt/mingyue-academic/static;
    index index.html;
    try_files $uri $uri/ /academic/index.html;
    add_header Cache-Control "no-cache";
}
